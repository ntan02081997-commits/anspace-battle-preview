name: Simulate and improve KHBD 15.1 classroom (isolated)
on:
  push:
    branches:
      - experiment/khbd15-classroom-sim-20261112
    paths:
      - 'classroom-sim/**'
      - '.github/workflows/classroom-sim.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: classroom-sim-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulate:
    if: github.ref == 'refs/heads/experiment/khbd15-classroom-sim-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify headless model
        run: python3 classroom-sim/simulate.py --self-test --runs 1 --out /tmp/classroom-test
      - name: Run baseline 10 synthetic lessons
        run: python3 classroom-sim/simulate.py --runs 10 --seed 151001 --out classroom-sim/results
      - name: Verify teacher reflection model
        run: python3 classroom-sim/reflection.py --self-test --lessons 1 --state /tmp/test-experience.json --out /tmp/reflection-test
      - name: Run 5 reflection-and-improvement lessons
        run: python3 classroom-sim/reflection.py --lessons 5 --state sim-experience/experience.json --out sim-experience/latest
      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: khbd15-classroom-baseline
          path: classroom-sim/results/
          if-no-files-found: error
          retention-days: 14
      - name: Upload iterative teacher reports and rubric scores
        uses: actions/upload-artifact@v4
        with:
          name: khbd15-reflection-3judges
          path: sim-experience/
          if-no-files-found: error
          retention-days: 30
      - name: Persist lesson reflections on experiment branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp sim-experience/latest/KHBD15_CHANGELOG.md sim-experience/KHBD15_CHANGELOG.md
          git add sim-experience/experience.json sim-experience/LATEST_LESSON_REVIEW.md sim-experience/KHBD15_CHANGELOG.md sim-experience/latest/every_lesson_scores.csv
          if git diff --cached --quiet; then echo 'Experience unchanged'; exit 0; fi
          git commit -m 'data(classroom): retain iterative lessons and judge evidence [skip ci]'
          git push origin HEAD:refs/heads/experiment/khbd15-classroom-sim-20261112
