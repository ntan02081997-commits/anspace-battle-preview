name: Publish isolated public Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build strictly allowlisted public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          test -s index.html
          cp index.html public/index.html
          touch public/.nojekyll
          if grep -R -Ei '(supabase\\.co|anspace-battle\\.vercel\\.app|service_role|SUPABASE_SERVICE_ROLE_KEY|https?://[^ "<>]+/rest/v1)' public; then
            echo 'BLOCKED: possible production backend or secret'
            exit 1
          fi
          test "$(find public -type f | wc -l)" -eq 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
