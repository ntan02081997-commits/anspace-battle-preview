name: Publish public Preview landing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure preview is isolated
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          if grep -R -Ei --include='*.html' --include='*.js' --include='*.json' '(supabase\.co|anspace-battle\.vercel\.app|service_role|SUPABASE_SERVICE_ROLE_KEY)' .; then
            echo 'Blocked: potential production endpoint or secret reference'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
